<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canasta</title>
<meta name="description" content="The classic rummy card game for 2 to 4 players at ACE Clan game nights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="../shared/room.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="sitebar">
  <div class="wrap sitebar-inner">
    <a class="ace" href="../">ACE<span>.</span><small>Games</small></a>
    <nav>
      <a href="../">Games</a>
    </nav>
  </div>
</header>

<main id="startView" class="wrap start" hidden></main>

<main id="gameView" class="wrap layout" hidden>
  <section class="board-col" aria-label="Table">
    <div id="others" class="others"></div>
    <div id="sides" class="sides"></div>
    <div id="middle" class="middle" hidden>
      <div class="pile-spot">
        <div id="stock"></div>
        <span id="stockText" class="muted small"></span>
      </div>
      <div class="pile-spot">
        <div id="pile"></div>
        <span id="pileText" class="muted small"></span>
      </div>
      <div id="staged" class="staged"></div>
    </div>
    <div id="controls" class="actions controls" hidden>
      <button id="drawBtn" class="btn primary" type="button">Draw</button>
      <button id="takeBtn" class="btn" type="button">Take the pile</button>
      <button id="stageBtn" class="btn" type="button">Make a meld group</button>
      <button id="meldBtn" class="btn primary" type="button">Meld</button>
      <button id="discardBtn" class="btn" type="button">Discard</button>
      <button id="clearBtn" class="link-btn" type="button">Clear</button>
    </div>
    <p id="helpText" class="muted small help-text"></p>
    <div id="hand" class="hand"></div>
    <div id="scoreBox" class="box" hidden>
      <h2>Scores</h2>
      <div id="scores"></div>
    </div>
  </section>
  <aside id="panel" class="panel"></aside>
</main>

<footer class="site-foot wrap">ACE Clan · Canasta</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="../shared/live.js"></script>
<script src="../shared/room.js"></script>
<script src="../shared/cards.js"></script>
<script src="canasta.js"></script>
</body>
</html>
