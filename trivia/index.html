<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clan Trivia</title>
<meta name="description" content="Quick-fire multiple-choice trivia for ACE Clan game nights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="../shared/room.css">
<link rel="stylesheet" href="../shared/fx.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="sitebar">
  <div class="wrap sitebar-inner">
    <a class="ace" href="../">ACE<span>.</span><small>Games</small></a>
    <nav>
      <a href="../">Games</a>
    </nav>
  </div>
</header>

<main id="startView" class="wrap start" hidden></main>

<main id="gameView" class="wrap layout" hidden>
  <section class="board-col" aria-label="Quiz">
    <div id="quiz" class="quiz" hidden>
      <div class="q-head">
        <span id="qNum" class="q-num"></span>
        <span id="qClock" class="q-clock"></span>
      </div>
      <div class="timer"><i id="timerBar"></i></div>
      <h2 id="qText" class="q-text"></h2>
      <div id="answers" class="answers"></div>
      <p id="qNote" class="q-note" aria-live="polite"></p>
    </div>
    <div id="podium" class="podium" hidden></div>
    <div class="box">
      <h2>Leaderboard</h2>
      <ol id="board" class="leaderboard"></ol>
    </div>
  </section>
  <aside id="panel" class="panel"></aside>
</main>

<footer class="site-foot wrap">ACE Clan · Clan Trivia</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="../shared/live.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/room.js"></script>
<script src="questions.js"></script>
<script src="trivia.js"></script>
</body>
</html>
