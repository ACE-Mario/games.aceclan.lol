<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ACE Punchline</title>
<meta name="description" content="Write the funniest answer to a prompt, then vote for your favourites. A party game for ACE Clan game nights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/site.css?v=20261127">
<link rel="stylesheet" href="../shared/room.css?v=20261127">
<link rel="stylesheet" href="../shared/fx.css?v=20261127">
<link rel="stylesheet" href="style.css?v=20261127">
</head>
<body>
<header class="sitebar">
  <div class="wrap sitebar-inner">
    <a class="ace" href="../">ACE<span>.</span><small>Games</small></a>
    <nav>
      <a href="../">Games</a>
    </nav>
  </div>
</header>

<main id="startView" class="wrap start" hidden></main>

<main id="gameView" class="wrap layout" hidden>
  <section class="board-col" aria-label="Game">
    <div id="stage" class="stage">
      <div class="st-head">
        <span id="stRound" class="st-round"></span>
        <span id="stClock" class="st-clock"></span>
      </div>
      <div id="stBody" class="st-body"></div>
    </div>
    <div id="podium" class="podium" hidden></div>
    <div class="box">
      <h2>Scores</h2>
      <ol id="board" class="leaderboard"></ol>
    </div>
  </section>
  <aside id="panel" class="panel"></aside>
</main>

<footer class="site-foot wrap">ACE Clan · ACE Punchline</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="../shared/live.js?v=20261127"></script>
<script src="../shared/fx.js?v=20261127"></script>
<script src="../shared/room.js?v=20261127"></script>
<script src="punchline.js?v=20261127"></script>
</body>
</html>
