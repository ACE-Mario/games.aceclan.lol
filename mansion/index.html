<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Haunted Mansion</title>
<meta name="description" content="An original co-op exploration game with a hidden traitor, for ACE Clan game nights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="../shared/room.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="sitebar">
  <div class="wrap sitebar-inner">
    <a class="ace" href="../">ACE<span>.</span><small>Games</small></a>
    <nav>
      <a href="../">Games</a>
    </nav>
  </div>
</header>

<main id="startView" class="wrap start" hidden></main>

<main id="gameView" class="wrap layout" hidden>
  <section class="board-col" aria-label="The house">
    <div id="secret" class="secret" hidden></div>
    <div id="hauntBar" class="haunt-bar" hidden></div>
    <div class="map-wrap"><div id="map" class="map"></div></div>
    <div id="controls" class="controls" hidden>
      <div class="pad" aria-label="Move">
        <button class="btn dir" data-dir="N" type="button" aria-label="Move north">▲</button>
        <button class="btn dir" data-dir="W" type="button" aria-label="Move west">◀</button>
        <span id="movesLeft" class="moves-left"></span>
        <button class="btn dir" data-dir="E" type="button" aria-label="Move east">▶</button>
        <button class="btn dir" data-dir="S" type="button" aria-label="Move south">▼</button>
      </div>
      <div class="acts">
        <div id="actRow" class="actions"></div>
        <div id="targetRow" class="actions"></div>
        <button id="endTurn" class="btn primary" type="button">End turn</button>
      </div>
    </div>
    <div id="rollBox" class="roll-box" hidden></div>
    <div id="explorers" class="explorers"></div>
  </section>
  <aside id="panel" class="panel"></aside>
</main>

<footer class="site-foot wrap">ACE Clan · Haunted Mansion</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="../shared/live.js"></script>
<script src="../shared/room.js"></script>
<script src="mansion.js"></script>
</body>
</html>
